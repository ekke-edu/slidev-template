name: Create release

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out full history and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          tag_version="${RELEASE_TAG#v}"
          package_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$package_version" ]; then
            echo "Tag $RELEASE_TAG does not match package version $package_version" >&2
            exit 1
          fi

      - name: Generate Conventional Commit release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          previous_tag="$(git tag --list --sort=-version:refname | grep -Fxv "$RELEASE_TAG" | head -n 1 || true)"
          node scripts/release-notes.mjs "$previous_tag" "$RELEASE_TAG" > "$RUNNER_TEMP/release-notes.md"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --verify-tag
